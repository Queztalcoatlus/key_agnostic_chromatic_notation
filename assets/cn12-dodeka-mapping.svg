<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="680" viewBox="0 0 1280 680" role="img" aria-labelledby="title description">
  <title id="title">CN12 on a Dodeka-style staff</title>
  <desc id="description">One chromatic octave from C4 to C5. CN12 numbers 1 through 12 ascend at equal semitone spacing, followed by 1 with an octave dot. The staff lines are C4, E4, G-sharp or A-flat 4, and C5. Line notes are 1, 5, 9; notes just above are 2, 6, 10; halfway between are 3, 7, 11; just below are 4, 8, 12. Conventional note names appear below the staff. Numbers are educational overlays on Dodeka pitch positions; duration is not illustrated.</desc>
  <metadata>Original CN12 mapping diagram. Pitch-position reference: https://dodekamusic.com/company/dodeka-blog/how-to-read-dodeka-sheet-music/</metadata>
  <rect width="1280" height="680" fill="#ffffff"/>
  <g font-family="DejaVu Sans, sans-serif">
    <text x="56" y="65" font-size="36" font-weight="700" fill="#172b3a">CN12 on a Dodeka-style staff</text>
    <text x="56" y="101" font-size="19" fill="#435465">C = 1  /  Twelve pitch classes  /  One vertical step = one semitone</text>
    <text x="56" y="160" font-size="14" font-weight="700" letter-spacing="1" fill="#435465">STAFF LINES</text>
    <text x="200" y="160" font-size="14" fill="#435465">Read the ascending pitches from left to right.</text>
    <text x="1104" y="152" text-anchor="middle" font-size="14" fill="#435465">Next octave</text>
    <g id="staff-line-0"><line x1="200" y1="420" x2="1160" y2="420" stroke="#263342" stroke-width="2"/><text x="176" y="425" text-anchor="end" font-size="17" fill="#263342">1 (C4)</text></g>
    <g id="staff-line-4"><line x1="200" y1="348" x2="1160" y2="348" stroke="#a33a45" stroke-width="2"/><text x="176" y="353" text-anchor="end" font-size="17" fill="#a33a45">5 (E)</text></g>
    <g id="staff-line-8"><line x1="200" y1="276" x2="1160" y2="276" stroke="#3064a0" stroke-width="2"/><text x="176" y="281" text-anchor="end" font-size="17" fill="#3064a0">9 (G# / Ab)</text></g>
    <g id="staff-line-12"><line x1="200" y1="204" x2="1160" y2="204" stroke="#263342" stroke-width="2"/><text x="176" y="209" text-anchor="end" font-size="17" fill="#263342">1 (C5)</text></g>
    <g id="note-0" data-semitones="0" data-pitch-class="1" data-note="C4">
      <rect x="213" y="404" width="54" height="32" fill="#172b3a"/>
      <text x="240" y="427" text-anchor="middle" font-size="21" font-weight="700" fill="#ffffff">1</text>
      
      <text x="240" y="474" text-anchor="middle" font-size="17" fill="#435465">C4</text>
    </g>
    <g id="note-1" data-semitones="1" data-pitch-class="2" data-note="C# / Db">
      <rect x="285" y="386" width="54" height="32" fill="#172b3a"/>
      <text x="312" y="409" text-anchor="middle" font-size="21" font-weight="700" fill="#ffffff">2</text>
      
      <text x="312" y="474" text-anchor="middle" font-size="14" fill="#435465">C# / Db</text>
    </g>
    <g id="note-2" data-semitones="2" data-pitch-class="3" data-note="D">
      <rect x="357" y="368" width="54" height="32" fill="#172b3a"/>
      <text x="384" y="391" text-anchor="middle" font-size="21" font-weight="700" fill="#ffffff">3</text>
      
      <text x="384" y="474" text-anchor="middle" font-size="17" fill="#435465">D</text>
    </g>
    <g id="note-3" data-semitones="3" data-pitch-class="4" data-note="D# / Eb">
      <rect x="429" y="350" width="54" height="32" fill="#172b3a"/>
      <text x="456" y="373" text-anchor="middle" font-size="21" font-weight="700" fill="#ffffff">4</text>
      
      <text x="456" y="474" text-anchor="middle" font-size="14" fill="#435465">D# / Eb</text>
    </g>
    <g id="note-4" data-semitones="4" data-pitch-class="5" data-note="E">
      <rect x="501" y="332" width="54" height="32" fill="#172b3a"/>
      <text x="528" y="355" text-anchor="middle" font-size="21" font-weight="700" fill="#ffffff">5</text>
      
      <text x="528" y="474" text-anchor="middle" font-size="17" fill="#435465">E</text>
    </g>
    <g id="note-5" data-semitones="5" data-pitch-class="6" data-note="F">
      <rect x="573" y="314" width="54" height="32" fill="#172b3a"/>
      <text x="600" y="337" text-anchor="middle" font-size="21" font-weight="700" fill="#ffffff">6</text>
      
      <text x="600" y="474" text-anchor="middle" font-size="17" fill="#435465">F</text>
    </g>
    <g id="note-6" data-semitones="6" data-pitch-class="7" data-note="F# / Gb">
      <rect x="645" y="296" width="54" height="32" fill="#172b3a"/>
      <text x="672" y="319" text-anchor="middle" font-size="21" font-weight="700" fill="#ffffff">7</text>
      
      <text x="672" y="474" text-anchor="middle" font-size="14" fill="#435465">F# / Gb</text>
    </g>
    <g id="note-7" data-semitones="7" data-pitch-class="8" data-note="G">
      <rect x="717" y="278" width="54" height="32" fill="#172b3a"/>
      <text x="744" y="301" text-anchor="middle" font-size="21" font-weight="700" fill="#ffffff">8</text>
      
      <text x="744" y="474" text-anchor="middle" font-size="17" fill="#435465">G</text>
    </g>
    <g id="note-8" data-semitones="8" data-pitch-class="9" data-note="G# / Ab">
      <rect x="789" y="260" width="54" height="32" fill="#172b3a"/>
      <text x="816" y="283" text-anchor="middle" font-size="21" font-weight="700" fill="#ffffff">9</text>
      
      <text x="816" y="474" text-anchor="middle" font-size="14" fill="#435465">G# / Ab</text>
    </g>
    <g id="note-9" data-semitones="9" data-pitch-class="10" data-note="A">
      <rect x="861" y="242" width="54" height="32" fill="#172b3a"/>
      <text x="888" y="265" text-anchor="middle" font-size="21" font-weight="700" fill="#ffffff">10</text>
      
      <text x="888" y="474" text-anchor="middle" font-size="17" fill="#435465">A</text>
    </g>
    <g id="note-10" data-semitones="10" data-pitch-class="11" data-note="A# / Bb">
      <rect x="933" y="224" width="54" height="32" fill="#172b3a"/>
      <text x="960" y="247" text-anchor="middle" font-size="21" font-weight="700" fill="#ffffff">11</text>
      
      <text x="960" y="474" text-anchor="middle" font-size="14" fill="#435465">A# / Bb</text>
    </g>
    <g id="note-11" data-semitones="11" data-pitch-class="12" data-note="B">
      <rect x="1005" y="206" width="54" height="32" fill="#172b3a"/>
      <text x="1032" y="229" text-anchor="middle" font-size="21" font-weight="700" fill="#ffffff">12</text>
      
      <text x="1032" y="474" text-anchor="middle" font-size="17" fill="#435465">B</text>
    </g>
    <g id="note-12" data-semitones="12" data-pitch-class="1" data-note="C5">
      <rect x="1077" y="188" width="54" height="32" fill="#172b3a"/>
      <text x="1104" y="211" text-anchor="middle" font-size="21" font-weight="700" fill="#ffffff">1</text>
      <circle cx="1104" cy="179" r="3.5" fill="#172b3a"/>
      <text x="1104" y="474" text-anchor="middle" font-size="17" fill="#435465">C5</text>
    </g>
    <text x="176" y="474" text-anchor="end" font-size="14" fill="#435465">Note name</text>
    <line x1="56" y1="505" x2="1224" y2="505" stroke="#d8e1e7"/>
    <g><rect x="56" y="530" width="280" height="90" rx="8" fill="#f1f5f8"/><text x="74" y="558" font-size="16" fill="#435465">On a line</text><text x="74" y="595" font-size="25" font-weight="700" fill="#172b3a" xml:space="preserve">1   5   9</text></g>
    <g><rect x="352" y="530" width="280" height="90" rx="8" fill="#f1f5f8"/><text x="370" y="558" font-size="16" fill="#435465">Just above a line</text><text x="370" y="595" font-size="25" font-weight="700" fill="#172b3a" xml:space="preserve">2   6   10</text></g>
    <g><rect x="648" y="530" width="280" height="90" rx="8" fill="#f1f5f8"/><text x="666" y="558" font-size="16" fill="#435465">Halfway between lines</text><text x="666" y="595" font-size="25" font-weight="700" fill="#172b3a" xml:space="preserve">3   7   11</text></g>
    <g><rect x="944" y="530" width="280" height="90" rx="8" fill="#f1f5f8"/><text x="962" y="558" font-size="16" fill="#435465">Just below a line</text><text x="962" y="595" font-size="25" font-weight="700" fill="#172b3a" xml:space="preserve">4   8   12</text></g>
    <text x="56" y="654" font-size="14" fill="#435465">Pitch mapping only. Numbers label the positions; note duration is not shown.</text>
  </g>
</svg>
